name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/ scripts/

      - name: Type check (mypy)
        run: mypy src/

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Upgrade setuptools (CVE PYSEC-2026-3447 requires >=83.0.0)
        run: pip install "setuptools>=83.0.0"

      - name: Audit dependencies
        # PYSEC-2026-2447: diskcache (transitive dep of ragas, no fixed version available)
        # PYSEC-2026-3046: ragas 0.4.x (dev-only eval tool, not in production image)
        run: pip-audit --ignore-vuln PYSEC-2026-2447 --ignore-vuln PYSEC-2026-3046

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        run: docker build -t rag-condominium-law:pr-${{ github.event.pull_request.number }} .
