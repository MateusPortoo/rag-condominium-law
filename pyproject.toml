[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-condominios"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "openai>=1.40.0",
    "qdrant-client>=1.10.0",
    "bm25s>=0.2.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "tiktoken>=0.7.0",
    "numpy>=1.26.0",
    "groq>=0.9.0",
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0,<2.0.0",
    "pip-audit>=2.7.0",
    "ragas>=0.2.0,<0.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_condominios"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["bm25s", "ragas", "ragas.metrics"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
